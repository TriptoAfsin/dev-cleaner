<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Cleaner</title>
    <script>
      // Paint the right theme on the first frame, before React loads.
      try {
        const s = JSON.parse(localStorage.getItem("dc-settings") || "{}")
        const mode = s.theme || "system"
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        if (s.accent) document.documentElement.style.setProperty("--accent-base", s.accent)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
