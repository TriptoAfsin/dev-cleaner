name: Release

# Push a semver tag like v0.2.0 (scripts/bump-version does it) to build and
# publish. Tags with a pre-release suffix (v0.2.0-beta.1) become pre-releases.
#
# Run it by hand to rebuild one platform of a release whose build failed
# (a download hiccup, say): give the tag, the draft release's id and the
# platform. It builds that tag's code into the existing draft and redoes
# the checksums.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, like v0.2.0
        required: true
      release_id:
        description: Id of the existing draft release to upload into
        required: true
      platform:
        description: Which builds to redo
        type: choice
        options: [linux, windows, macos, all]
        default: linux

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # One draft release, created before any build starts, so parallel builds
  # upload into the same release instead of racing to create one each.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id || inputs.release_id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Every build on a tag push; only the chosen one when run by hand.
      - name: Choose the builds
        id: matrix
        shell: bash
        env:
          PICK: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"platform":"macos-latest","args":"--target aarch64-apple-darwin","os":"macos"},
            {"platform":"macos-latest","args":"--target x86_64-apple-darwin","os":"macos"},
            {"platform":"windows-latest","args":"","os":"windows"},
            {"platform":"ubuntu-22.04","args":"","os":"linux"}
          ]'
          echo "matrix=$(jq -c --arg p "$PICK" '{include: [.[] | select($p == "all" or .os == $p)]}' <<<"$all")" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: create
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${TAG#v}
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          [ -z "$NOTES" ] && NOTES="See CHANGELOG.md for details."
          PRE=false
          case "$VERSION" in *-*) PRE=true ;; esac
          {
            echo "## What's changed"
            echo "$NOTES"
            echo
            echo "## Downloads"
            echo '- Windows: `.msi` or `-setup.exe`, or the portable `.zip`'
            echo '- macOS: `.dmg`, separate Apple silicon (aarch64) and Intel (x64) builds'
            echo '- Linux: `.AppImage` (any distro), `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) or `.flatpak` (`flatpak install --user Dev.Cleaner_*.flatpak`)'
            echo
            echo "Or install with Homebrew, Scoop or WinGet: see the README."
            echo
            echo "## Note on unsigned builds"
            echo 'These binaries are not code-signed yet. On Windows, SmartScreen shows "Windows protected your PC": click More info, then Run anyway. On macOS, run `xattr -cr "/Applications/Dev Cleaner.app"` or open System Settings > Privacy & Security and click Open Anyway. Check downloads against the SHA-256 checksums below or in `SHA256SUMS.txt`.'
          } > body.md
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Dev Cleaner v$VERSION" \
            -F draft=true -F prerelease=$PRE -F body=@body.md --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-release.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # The bundler downloads AppImage tools from GitHub release assets, which
      # sometimes answer 504 to runners. Fetch them first with retries into
      # the cache the bundler checks (names match @tauri-apps/cli 2.12).
      - name: Prefetch AppImage tools (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="$HOME/.cache/tauri"
          mkdir -p "$dir"
          get() { curl -fL --retry 8 --retry-all-errors --retry-delay 15 -o "$dir/$1" "$2" && chmod +x "$dir/$1"; }
          base=https://github.com/tauri-apps/binary-releases/releases/download
          get AppRun-x86_64 "$base/apprun-old/AppRun-x86_64"
          get linuxdeploy-07333c6-x86_64.AppImage "$base/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage"
          get linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage || true

      - name: Build the app
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # One more try after a pause: tool downloads (WiX, NSIS, AppImage) fail
      # now and then with a 5xx from GitHub's CDN.
      - name: Wait before retrying
        if: steps.build.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Build the app (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Runs without installing; the `portable` file keeps all data in a
      # `data` folder beside the exe. This is what Scoop installs.
      - name: Portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "$env:TAG".TrimStart('v')
          $dir = "Dev Cleaner"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "src-tauri/target/release/dev-cleaner.exe" "$dir/Dev Cleaner.exe"
          Set-Content "$dir/portable" "Dev Cleaner keeps its settings in the data folder next to it while this file is here. Delete this file to use the normal per-user folder instead. Needs the Microsoft Edge WebView2 Runtime, which Windows 10 and 11 already have."
          $zip = "Dev.Cleaner_${version}_x64_portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$zip" `
            -H "Content-Type: application/zip" --input $zip --jq .name

      # Microsoft Store package, unsigned: the Store signs it on upload. Kept
      # as a workflow artifact, not a release download, since an unsigned
      # MSIX won't install outside the Store. Upload it in Partner Center.
      - name: MSIX for the Microsoft Store (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Version "$env:TAG"

      - name: Keep the MSIX
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: msstore-msix
          path: dist-msix/*.msix

  # Tag pushes only: the Flatpak build checks out the commit that triggered it.
  flatpak:
    if: github.event_name == 'push'
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    with:
      release_id: ${{ needs.create-release.outputs.release_id }}

  # SHA-256 of every download, as SHA256SUMS.txt and in the release notes.
  # Scoop's autoupdate reads its hash from SHA256SUMS.txt.
  checksums:
    needs: [create-release, release, flatpak]
    if: always() && needs.release.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.flatpak.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA-256 of every download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir dl
          gh api "repos/$REPO/releases/$ID/assets" --paginate --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r asset name; do
              # A rebuild replaces the old checksums file.
              if [ "$name" = "SHA256SUMS.txt" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$asset"; continue; fi
              gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > "dl/$name"
            done
          (cd dl && sha256sum -- * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input SHA256SUMS.txt --jq .name
          # Drop checksums from an earlier run before adding the new ones.
          gh api "repos/$REPO/releases/$ID" --jq .body | sed '/^## SHA-256 checksums/,$d' > body.md
          printf '\n## SHA-256 checksums\n\n```\n%s\n```\n' "$(cat SHA256SUMS.txt)" >> body.md
          # The tag goes with the edit: without it a draft loses its tag.
          gh api -X PATCH "repos/$REPO/releases/$ID" -f tag_name="$TAG" -F body=@body.md --jq .html_url
